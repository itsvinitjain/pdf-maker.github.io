<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Southern Pottery | Luxe Catalog Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;600;700&display=swap');
       
        :root {
            --brand-gold: #b8924a;
            --brand-dark: #0a0a0a;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
       
        .glass-panel {
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .pdf-container {
            width: 210mm;
            margin: 0 auto;
            padding-bottom: 0;
        }
        .pdf-page {
            width: 210mm;
            height: 287mm;                 /* safe under 297mm */
            padding: 8mm;
            background: #ffffff;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 0;
            box-sizing: border-box;
            position: relative;
            page-break-inside: avoid;      /* prevent splitting a page div */
        }
        .grid-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            padding: 0;
            height: 100%;
            overflow: hidden;
            box-sizing: border-box;
            page-break-inside: avoid;      /* prevent card from splitting across pages */
        }
        .card-image-container {
            width: 100%;
            height: 72%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .card-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .card-content {
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            background: #fff;
            border-top: 1px solid #f3f4f6;
            overflow: hidden;
        }
        .item-title {
            font-family: 'Cinzel', serif;
            color: #000;
            font-size: 13px;
            line-height: 1.2;
            font-weight: 900;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.01em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .item-desc {
            color: #4b5563;
            font-size: 8.5px;
            line-height: 1.2;
            font-weight: 400;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: auto;
            padding-top: 4px;
        }
        .item-price {
            color: var(--brand-gold);
            font-size: 13px;
            font-weight: 800;
        }
        .ref-code {
            font-size: 7px;
            color: #9ca3af;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
        .placeholder-img {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9fafb;
            color: #d1d5db;
            font-size: 0.6rem;
            height: 100%;
            width: 100%;
            text-align: center;
            font-weight: bold;
        }
        .spinner {
            border: 2px solid rgba(255,255,255,0.1);
            border-top: 2px solid var(--brand-gold);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media print {
            body { background: none; }
            .no-print { display: none !important; }
            .pdf-page { box-shadow: none; margin: 0; border: none; }
        }
    </style>
</head>
<body class="pb-20">
    <header class="no-print border-b border-white/5 bg-black/90 sticky top-0 z-50 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#b8924a] rounded-sm flex items-center justify-center shadow-lg shadow-gold/20">
                    <span class="text-black font-black text-xl italic font-serif">SP</span>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-widest text-white font-serif" style="font-family: 'Cinzel', serif;">SOUTHERN <span class="text-[#b8924a] font-normal">POTTERY</span></h1>
                </div>
            </div>
           
            <div class="flex items-center gap-2">
                <button id="importBtn" class="px-4 py-2 rounded bg-white/5 hover:bg-white/10 text-white text-xs font-semibold transition-all uppercase tracking-widest">
                    Import
                </button>
                <button id="aiEnhanceBtn" class="px-4 py-2 rounded bg-[#b8924a] text-black text-xs font-black transition-all flex items-center gap-2 uppercase tracking-widest">
                    <span id="aiLabel">AI Studio</span>
                </button>
                <button id="downloadBtn" class="px-4 py-2 rounded bg-white text-black text-xs font-black hover:bg-gray-200 transition-all uppercase tracking-widest">
                    Export PDF
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div id="aiPanel" class="hidden fixed top-20 right-8 w-64 glass-panel shadow-2xl rounded-lg p-5 z-50 no-print">
            <h4 class="font-black text-[#b8924a] text-[10px] uppercase tracking-[0.2em] mb-4 border-b border-white/10 pb-2">Catalog Copywriting</h4>
            <div class="space-y-2">
                <button onclick="enhanceContent('ultra-luxury and minimal')" class="w-full text-left bg-white/5 p-3 rounded text-[10px] text-white hover:bg-[#b8924a] hover:text-black font-bold transition-all uppercase tracking-wider">High-End Curator</button>
                <button onclick="enhanceContent('short, punchy, bold')" class="w-full text-left bg-white/5 p-3 rounded text-[10px] text-white hover:bg-[#b8924a] hover:text-black font-bold transition-all uppercase tracking-wider">Minimalist Tag</button>
                <div class="pt-4 mt-2 border-t border-white/10">
                    <input type="text" id="targetLang" placeholder="Translate to..." class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-[10px] text-white mb-2 focus:outline-none focus:border-[#b8924a]">
                    <button onclick="translateCatalog()" class="w-full bg-[#b8924a] text-black py-2 rounded text-[10px] font-black uppercase tracking-widest">Translate</button>
                </div>
            </div>
        </div>

        <input type="file" id="csvFile" accept=".csv" class="hidden">

        <div id="pdf-wrapper" class="pdf-container">
            <div class="pdf-page" id="initial-page">
                <script>
                    for(let i=1; i<=9; i++) {
                        document.write(`
                            <div class="grid-card">
                                <div class="card-image-container">
                                    <div class="placeholder-img uppercase tracking-tighter">Southern Pottery Slot ${i}</div>
                                </div>
                                <div class="card-content">
                                    <div class="h-4 bg-gray-100 w-3/4 mb-2"></div>
                                    <div class="h-2 bg-gray-50 w-full mb-1"></div>
                                    <div class="h-2 bg-gray-50 w-1/2"></div>
                                </div>
                            </div>
                        `);
                    }
                </script>
            </div>
        </div>
    </main>

    <script>
        const apiKey = ""; // ← your Gemini API key here

        const importBtn    = document.getElementById('importBtn');
        const csvFileInput = document.getElementById('csvFile');
        const downloadBtn  = document.getElementById('downloadBtn');
        const aiEnhanceBtn = document.getElementById('aiEnhanceBtn');
        const aiPanel      = document.getElementById('aiPanel');
        const pdfWrapper   = document.getElementById('pdf-wrapper');

        let currentData = [];

        importBtn.addEventListener('click', () => csvFileInput.click());
        aiEnhanceBtn.addEventListener('click', () => aiPanel.classList.toggle('hidden'));

        csvFileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => processCSV(event.target.result);
            reader.readAsText(file);
        });

        function formatDriveLink(url) {
            if (!url) return '';
            if (url.includes('drive.google.com')) {
                const match = url.match(/\/d\/([^\/]+)/) || url.match(/id=([^\&]+)/);
                if (match && match[1]) {
                    return `https://lh3.googleusercontent.com/u/0/d/${match[1]}=w1000`;
                }
            }
            return url;
        }

        function getDriveLink(url) {
            if (!url) return '';
            if (url.includes('drive.google.com')) {
                const match = url.match(/\/d\/([^\/]+)/) || url.match(/id=([^\&]+)/);
                if (match && match[1]) {
                    return `https://drive.google.com/file/d/${match[1]}/view`;
                }
            }
            return url;
        }

        function processCSV(csvText) {
            const rawLines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
            const rows = rawLines.slice(1);
            currentData = [];
            pdfWrapper.innerHTML = '';

            const itemsPerPage = 9;
            const totalPages = Math.ceil(rows.length / itemsPerPage);

            for (let p = 0; p < totalPages; p++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'pdf-page';

                for (let i = 0; i < itemsPerPage; i++) {
                    const dataIndex = (p * itemsPerPage) + i;
                    const cell = document.createElement('div');
                    cell.className = 'grid-card';

                    if (dataIndex < rows.length) {
                        let row = rows[dataIndex].trim();
                        if (row.startsWith('"') && row.endsWith('"')) {
                            row = row.substring(1, row.length - 1);
                        }
                        const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"|"$/g, ''));
                        const [imgUrl, title, desc, price] = columns;

                        const item = { imgUrl, title, desc, price, index: dataIndex };
                        currentData.push(item);
                        renderItem(cell, item);
                    } else {
                        cell.innerHTML = `<div class="card-image-container"><div class="placeholder-img"></div></div><div class="card-content"></div>`;
                    }
                    pageDiv.appendChild(cell);
                }
                pdfWrapper.appendChild(pageDiv);
            }

            // Apply forced page breaks AFTER each page EXCEPT the very last one
            const allPages = pdfWrapper.querySelectorAll('.pdf-page');
            allPages.forEach((page, index) => {
                if (index < allPages.length - 1) {
                    page.style.pageBreakAfter = 'always';
                }
            });
        }

        function renderItem(cell, item) {
            const processedImg = formatDriveLink(item.imgUrl);
            const driveLink = getDriveLink(item.imgUrl);
            cell.innerHTML = `
                <div class="card-image-container">
                    <a href="${driveLink}" target="_blank" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-decoration: none;">
                        <img src="${processedImg}" class="card-image" style="cursor: pointer;" crossorigin="anonymous" onerror="this.outerHTML='<div class=placeholder-img>Awaiting Visual</div>'" data-drive-link="${driveLink}">
                    </a>
                </div>
                <div class="card-content">
                    <div>
                        <h3 class="item-title">${item.title || 'Artisanal Piece'}</h3>
                        <p class="item-desc">${item.desc || 'Premium handcrafted pottery selection.'}</p>
                    </div>
                    <div class="price-row">
                        <span class="item-price">${item.price ? '₹' + item.price : ''}</span>
                        <span class="ref-code">REF: SP-${item.index + 101}</span>
                    </div>
                </div>
            `;
        }

        async function callGemini(prompt, isJson = true) {
            const label = document.getElementById('aiLabel');
            label.innerHTML = `<span class="spinner"></span>`;

            try {
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: isJson ? {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                    index: { type: "NUMBER" },
                                    title: { type: "STRING" },
                                    desc: { type: "STRING" }
                                }
                            }
                        }
                    } : {}
                };
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                label.innerText = "AI Studio";
                const text = data.candidates[0].content.parts[0].text;
                return isJson ? JSON.parse(text) : text;
            } catch (err) {
                label.innerText = "AI Studio";
                console.error(err);
            }
        }

        async function enhanceContent(style) {
            if (currentData.length === 0) return;
            aiPanel.classList.add('hidden');
            const prompt = `Act as a luxury catalog copywriter for Southern Pottery. Rewrite titles and descriptions for these pottery/glass items in a ${style} tone. Titles must be bold, uppercase, and can span two lines. Descriptions max 70 chars. JSON required. Data: ${JSON.stringify(currentData.map(d => ({ index: d.index, title: d.title, desc: d.desc })))}`;
            const results = await callGemini(prompt);
            if (results) applyUpdates(results);
        }

        async function translateCatalog() {
            const lang = document.getElementById('targetLang').value || "Hindi";
            if (currentData.length === 0) return;
            aiPanel.classList.add('hidden');
            const prompt = `Translate titles and descriptions to ${lang}. Keep the premium Southern Pottery feel. JSON required. Data: ${JSON.stringify(currentData.map(d => ({ index: d.index, title: d.title, desc: d.desc })))}`;
            const results = await callGemini(prompt);
            if (results) applyUpdates(results);
        }

        function applyUpdates(results) {
            const allCards = document.querySelectorAll('.grid-card');
            results.forEach(res => {
                const item = currentData.find(d => d.index === res.index);
                if (item) {
                    item.title = res.title;
                    item.desc = res.desc;
                    const cell = allCards[res.index];
                    if (cell) renderItem(cell, item);
                }
            });
        }

        downloadBtn.addEventListener('click', () => {
            const opt = {
                margin: [2, 0, 2, 0],          // very tight to minimize drift
                filename: 'Southern_Pottery_Catalog.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: {
                    scale: 2.5,
                    useCORS: true,
                    letterRendering: true,
                    scrollY: 0,
                    onclone: (clonedDoc) => {
                        clonedDoc.body.style.marginBottom = '0px';
                        clonedDoc.body.style.paddingBottom = '0px';
                        const container = clonedDoc.querySelector('.pdf-container');
                        if (container) container.style.paddingBottom = '0px';
                        const pages = clonedDoc.querySelectorAll('.pdf-page');
                        pages.forEach(p => { 
                            p.style.marginBottom = '0px';
                            p.style.pageBreakInside = 'avoid';
                        });
                    }
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['css', 'legacy'] }  // respect CSS + legacy for better break handling
            };

            html2pdf().set(opt).from(pdfWrapper).save();
        });
    </script>
</body>
</html>
